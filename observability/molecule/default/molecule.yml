---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    role-file: molecule/default/test-role-requirements.yml
    force: true
    p: $HOME/.ansible/

driver:
  name: docker

platforms:
  - name: "observability-${MOLECULE_SCENARIO_NAME}"
    image: "${DOCKER_REGISTRY:-quay.io/gotmax23}/${DOCKER_IMAGE_TAG:-debian-systemd:trixie}"
    command: ${DOCKER_COMMAND:-""}
    pre_build_image: true
    privileged: true
    systemd: true
    groups:
      - grafana_all
      - haproxy
      - galera_all

provisioner:
  name: ansible
  lint:
    name: ansible-lint
  env:
    ANSIBLE_ROLES_PATH: $HOME/.ansible/
  inventory:
    host_vars:
      observability-default:
        management_address: 127.0.0.1
    group_vars:
      all:
        molecule_grafana_version: 13.1.0
        _molecule_password_mapping:
          grafana_db_password: Ievahqu7se8voKooghi7ri8Aij6The
          grafana_admin_password: leeliel4ceiKaxieSha5go1sah6boh
          galera_root_password: xuchotiriuda3phoo8aichaeg9eeTh
          galera_monitoring_user_password: paiheejahp0hu4aw3Ee1hah1viophu
        install_method: distro
        internal_lb_vip_address: 127.0.1.1
        haproxy_ssl: false
        haproxy_ssl_all_vips: false
        galera_address: "{{ internal_lb_vip_address }}"
        galera_server_bind_address: 127.0.0.1
        galera_install_method: "{{ install_method }}"
        openstack_service_accept_both_protocols: false
        galera_haproxy_services:
          haproxy_service_name: galera
          haproxy_backend_nodes: "{{ groups['galera_all'][:1] }}"
          haproxy_bind:
            - address: "{{ galera_address }}"
              interface: lo
          haproxy_port: 3306
          haproxy_check_port: 9200
          haproxy_balance_type: tcp
          haproxy_service_enabled: true
  config_options:
    defaults:
      inject_facts_as_vars: false
