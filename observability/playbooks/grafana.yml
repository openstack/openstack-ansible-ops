- name: Cache grafana haproxy service configs as host facts
  hosts: grafana_all
  tasks:
    - name: Set grafana_haproxy_services fact
      ansible.builtin.set_fact:
        grafana_haproxy_services: "{{ grafana_haproxy_services }}"

- name: Configure haproxy services
  ansible.builtin.import_playbook: openstack.osa.haproxy_service_config
  vars:
    service_group: grafana_all
    service_variable: "grafana_haproxy_services"
  when:
    - groups[service_group] | length > 0
    - groups['haproxy'] | length > 0
  tags:
    - haproxy-service-config

- name: Deploy Grafana
  hosts: grafana_all
  roles:
    - role: osa_ops.observability.grafana
    - role: grafana.grafana.grafana
