- name: Setup installation variables
  ansible.builtin.include_role:
    name: openstack.osa.install_defaults
    defaults_from: "{{ install_method }}"
    public: true
    apply:
      tags:
        - always
  tags:
    - always

- name: Create database for Grafana
  ansible.builtin.include_role:
    name: openstack.osa.db_setup
    apply:
      tags:
        - common-db
  vars:
    _oslodb_setup_host: "{{ grafana_db_setup_host }}"
    _oslodb_ansible_python_interpreter: "{{ grafana_db_setup_python_interpreter }}"
    _oslodb_setup_endpoint: "{{ galera_address | default('127.0.0.1') }}"
    _oslodb_databases:
      - name: "{{ grafana_db_database }}"
        users:
          - username: "{{ grafana_db_user }}"
            password: "{{ grafana_db_password }}"
  run_once: true
  tags:
    - common-db

# NOTE: grafana.grafana.grafana has a race condition, due to which
#       restarts grafana-server during db migration phase.
- name: Create Grafana health check helper script
  ansible.builtin.template:
    src: grafana-wait.py.j2
    dest: /usr/local/bin/grafana-wait
    mode: "0755"

- name: Add systemd overrides for grafana
  ansible.builtin.import_role:
    name: systemd_service
  vars:
    systemd_services:
      - service_name: grafana-server
        systemd_overrides_only: true
        systemd_overrides:
          Service:
            ExecStartPost: /usr/local/bin/grafana-wait
        load: false
