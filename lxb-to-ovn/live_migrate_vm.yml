- name: "Unpausing to enable live migration for {{ item.Name }}"
  command: "openstack server unpause {{ item.ID }}"
  when: item.Status == "PAUSED"

- name: "Resuming from suspend to enable live migration for {{ item.Name }}"
  command: "openstack server resume {{ item.ID }}"
  when: item.Status == "SUSPENDED"

- name: "Waiting for {{ item.Name }} state to become ACTIVE..."
  command: "openstack server show {{ item.ID }} -f json"
  register: vm_status
  retries: 10
  delay: 6
  until: (vm_status.stdout | from_json).status == "ACTIVE"
  when: item.Status in ["PAUSED", "SUSPENDED"]

- name: "Performing live migration for {{ item.Name }} - please wait..."
  command: "openstack server migrate --os-compute-api-version 2.96 --live-migration {{ migrate_destination is defined | ternary('--host '+migrate_destination|default(''),'') }} {{ item.ID }} --wait --insecure"
  when: item.Status in ["ACTIVE", "PAUSED", "SUSPENDED"]

- name: "Repausing {{ item.Name }}"
  command: "openstack server pause {{ item.ID }}"
  when: item.Status == "PAUSED"

- name: "Resuspending {{ item.Name }}"
  command: "openstack server suspend {{ item.ID }}"
  when: item.Status == "SUSPENDED"

- name: "Performing cold migration for {{ item.Name }} - please wait..."
  command: "openstack server migrate --os-compute-api-version 2.96 {{ migrate_destination is defined | ternary('--host '+migrate_destination|default(''),'') }} {{ item.ID }} --wait --insecure"
  when: item.Status == "SHUTOFF"

- name: "Confirming cold migration for {{ item.Name }}"
  command: "openstack server migration confirm {{ item.ID }} --insecure"
  when: item.Status == "SHUTOFF"
